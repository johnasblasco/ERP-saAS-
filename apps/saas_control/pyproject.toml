[project]
name = "saas_control"
authors = [
    { name = "johnasblasco", email = "johnaslblasco@gmail.com" }
]
description = "SaaS control plane: plans, tenant provisioning, billing, webhook routing"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = ["requests"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "W191"]

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
